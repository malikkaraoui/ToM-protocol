[package]
name = "tom-protocol"
version = "0.2.0"
edition = "2021"
rust-version.workspace = true
description = "ToM Protocol layer — routing, encryption, discovery on top of tom-transport"

[dependencies]
tom-transport = { path = "../tom-transport" }
tom-dht = { path = "../tom-dht" }  # Phase R7.1: DHT discovery
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"  # sérialise Vec<u8>/&[u8] en MessagePack `bin` compact (pas en tableau d'entiers)
rmp-serde = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"

# Crypto (Story 1.2 + 1.3)
chacha20poly1305 = { version = "0.10", features = ["std"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
curve25519-dalek = "=5.0.0-pre.1"
sha2 = "0.10"
hkdf = "0.12"
ed25519-dalek = "=3.0.0-pre.1"

# Runtime (Phase 2)
tokio = { version = "1", features = ["sync", "time", "rt"] }
async-trait = "0.1"

# State persistence (Phase R8.2)
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"

# Metrics (Phase R8.5)
tom-metrics = { path = "../tom-metrics" }

# Anti-spam (Phase R11.1)
lru = "0.16.3" # min requise : RUSTSEC-2026-0002 corrigee a partir de 0.16.3 (review copilot PR #43)

# Gossip discovery (Phase 3)
tom-connect = { path = "../tom-connect" }
tom-gossip = { path = "../tom-gossip" }
bytes = "1"
n0-future = "0.3"

# Embedded relay (Phase R16)
tom-relay = { path = "../tom-relay", features = ["server"] }

# UPnP port mapping for embedded relay (R13)
portmapper = { version = "0.13", default-features = false }

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["full"] }
tom-connect = { path = "../tom-connect" }
rand = "0.9"
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
