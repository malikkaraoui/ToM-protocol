# cargo-deny — supply chain du workspace (chantier S0.5, roadmap SDK)
# Périmètre initial : advisories (CVE RustSec) + bans + sources.
# Le check `licenses` est volontairement différé : l'allowlist doit être
# constituée crate par crate (forks iroh inclus) — backlog S0.
# Usage local : cargo deny check advisories bans sources

[advisories]
# Politique v2 par défaut : toute advisory non ignorée = erreur.
yanked = "warn"
# État initial relevé le 2026-06-10 (chantier S0.5) : 10 advisories préexistantes
# dans l'arbre de deps hérité du fork iroh 0.96. Ignorées pour ne pas bloquer la CI,
# TRIAGE CORRECTIF DÛ — voir docs/plans/2026-06-10-chantier-s0-suivi.md.
# Toute NOUVELLE advisory fera échouer la CI (comportement voulu).
ignore = [
    # hickory 0119/0118 : CORRIGÉES le 2026-06-12 par bump majeur
    # hickory-resolver 0.24/0.25 → 0.26.1 (tom-relay, tom-connect,
    # tom-transport) — ignores retirés.
    # rustls-webpki 0049/0098/0099/0104 : CORRIGÉES le 2026-06-11 par
    # cargo update -p rustls-webpki (0.103.9 → 0.103.13) — ignores retirés.
    "RUSTSEC-2026-0097", # rand 0.9.2 — unsound avec logger custom. Fix annoncé >=0.9.3 PAS ENCORE PUBLIÉ (cargo update sans effet, vérifié 2026-06-11). Exposition faible : pas de logger custom dans le workspace. À re-vérifier périodiquement. Nota : la contrainte rand de tom-gossip ("0.9.2" = caret ^0.9.2) acceptera 0.9.3 sans modification.
    "RUSTSEC-2026-0002", # lru IterMut unsound (le commentaire initial disait slab — erreur corrigée 2026-06-11). Usage DIRECT corrigé : tom-protocol bumpe lru 0.12→0.16.3. Reste lru 0.12.5 via ratatui 0.29 (tom-tui, UI seulement) — exposition : IterMut non utilisé par notre code.
    "RUSTSEC-2024-0436", # paste unmaintained — dep transitive, remplaçant: pastey
    "RUSTSEC-2023-0089", # atomic-polyfill unmaintained — dep transitive
    # RUSTSEC-2026-0194/0195 : quick-xml 0.38.4 (DoS CPU/mémoire sur XML non
    # fiable) via plist -> netdev -> netwatch/portmapper -> tom-connect.
    # Exposition jugée faible : netdev l'utilise pour lire les métadonnées
    # d'interfaces réseau LOCALES (plist Apple), pas pour parser du XML
    # distant/non fiable — les deux CVE nécessitent un attaquant qui contrôle
    # le contenu XML analysé. Fix amont pas encore disponible en respectant
    # semver : `plist` ne monte qu'à 1.9.0 (quick-xml 0.39.4, encore < 0.41.0
    # requis) ; il faudrait bumper `netdev` en version majeure (0.40 -> 0.45)
    # non testée ici — reporté, à re-vérifier périodiquement (cf RUSTSEC-2026-0097).
    "RUSTSEC-2026-0194", # quick-xml quadratic attribute-dup check — via netdev (local, pas de XML distant)
    "RUSTSEC-2026-0195", # quick-xml NsReader unbounded namespace alloc — même chemin, même exposition
]

[bans]
# Duplications de versions assumées (forks iroh : hickory 0.24/0.25, etc.)
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Pas de dépendance git aujourd'hui — toute apparition doit être délibérée.
allow-git = []
