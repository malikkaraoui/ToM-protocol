# Drop-in systemd — à déployer sur le NAS dans
# /etc/systemd/system/tom-node.service.d/override.conf
# (via `systemctl edit tom-node` ou scp direct + `systemctl daemon-reload`)
#
# But : borner la durée de vie du process, indépendamment de toute fuite
# détectée ou non. Restart=always est déjà confirmé (scripts/deploy-nas-node.sh)
# — RuntimeMaxSec ajoute le cycle forcé qui manquait : le service se relance
# tout seul avant d'avoir eu le temps d'accumuler quoi que ce soit
# d'incontrôlé, plutôt que de dépendre d'un monitoring humain qui peut
# lui-même mourir en silence (cf. incident 2026-07-22 : boucle CSV locale
# morte à 12h04, personne ne l'a su avant 9h30 plus tard, pic 100°C).
#
# 4h = choix conservateur au-dessus de la fenêtre d'endurance déjà validée
# à plat (~2h15, campagne du 22/07 matin) — à ajuster si besoin.
[Service]
RuntimeMaxSec=14400
