name: CI

# Flux par pull request (harnais, modèle ~/.harnais/canon/templates/ci/) :
# le workflow tourne TOUJOURS (aucun filtre paths: au déclencheur) pour que le
# check requis `harnais-ok` existe sur chaque PR. Les jobs de test sont sautés
# par `if:` au niveau du job quand seul vault/ change (job `changes`).
# `harnais-ok` est le SEUL check à rendre obligatoire (ruleset de main).
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      # fetch-depth: 0 récupère tout l'historique, nécessaire pour comparer à la base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Détecter si le code change (hors vault/)
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -u
          # code=false SEULEMENT si la liste des fichiers changés est non vide et ne contient que vault/.
          # Toute autre situation (base introuvable, erreur git, merge_group, SHA nul) donne code=true :
          # on lance les tests plutôt que de les sauter à tort.
          code=true
          case "$EVENT_NAME" in
            pull_request)
              base="origin/$BASE_REF"
              range="$base...HEAD" ;;
            push)
              base="$EVENT_BEFORE"
              range="$base..HEAD" ;;
            *)
              base="" ;;
          esac
          # --no-renames : un renommage de code vers vault/ doit compter comme un changement de code.
          if [ -n "$base" ] \
            && git cat-file -e "$base^{commit}" 2>/dev/null \
            && git diff --no-renames --name-only "$range" > "$RUNNER_TEMP/changed.txt" 2>/dev/null \
            && [ -s "$RUNNER_TEMP/changed.txt" ] \
            && [ -z "$(grep -v '^vault/' "$RUNNER_TEMP/changed.txt")" ]; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Événement : $EVENT_NAME, code=$code"
          cat "$RUNNER_TEMP/changed.txt" 2>/dev/null || true

  typescript:
    name: TypeScript (build + test + lint)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test

      - run: pnpm lint

  observability-smoke:
    name: Observability smoke (relay + discovery)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lsof

      - name: Run observability smoke
        run: |
          chmod +x scripts/run-observability-smoke-local.sh
          ./scripts/run-observability-smoke-local.sh

  rust-protocol:
    name: Rust protocol (build + test + clippy)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p tom-protocol

      - name: Test
        run: cargo test -p tom-protocol

      - name: Clippy
        run: cargo clippy -p tom-protocol -- -D warnings

  rust-transport:
    name: Rust transport (build + test + clippy)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p tom-transport

      - name: Test
        # --test-threads=1 : ces tests ouvrent de vrais sockets UDP/QUIC ; en
        # parallèle ils se disputent ports/timing (flake gate_rejects_unlisted_peer,
        # observé rouge/vert en alternance). Sérialisés ils sont stables — même
        # discipline que le job rust-integration ci-dessous.
        run: cargo test -p tom-transport -- --test-threads=1

      - name: Clippy
        run: cargo clippy -p tom-transport -- -D warnings

  rust-integration:
    name: Rust cross-crate integration (multi-node, real network)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p tom-integration-tests --tests

      # Real multi-node scenarios incl. a 2min stability run — jamais lancé
      # en CI auparavant (dépendance transport→protocol→relay non couverte).
      # --test-threads=1 : chaque test ouvre de vrais sockets UDP/QUIC ;
      # en parallèle ils se disputent le réseau du runner et un test se fige
      # au hasard → timeout 10min (cause des runs rouges de juin/juillet 2026).
      - name: Test
        run: cargo test -p tom-integration-tests -- --test-threads=1
        timeout-minutes: 10

      - name: Clippy
        run: cargo clippy -p tom-integration-tests --tests -- -D warnings

  rust-fork:
    name: Rust fork crates (build + test + clippy)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p tom-base -p tom-metrics -p tom-quinn-proto -p tom-quinn -p tom-connect -p tom-relay -p tom-gossip

      - name: Test foundation crates
        run: |
          cargo test -p tom-base
          cargo test -p tom-metrics
          cargo test -p tom-quinn-proto --lib
          cargo test -p tom-quinn --lib

      - name: Test tom-relay
        run: cargo test -p tom-relay --lib

      - name: Test tom-gossip
        run: cargo test -p tom-gossip --lib

      # Was built+clippied above but never tested — ~78 tests were dead in CI.
      - name: Test tom-connect
        run: cargo test -p tom-connect --lib

      - name: Clippy
        run: cargo clippy -p tom-base -p tom-metrics -p tom-quinn-proto -p tom-quinn -p tom-connect -p tom-relay -p tom-gossip -- -D warnings

  rust-dht:
    name: Rust DHT discovery (build + test + clippy)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p tom-dht

      # Real mainline::Testnet DHT (churn/blackout chaos included) — ~50s, no real network needed.
      - name: Test
        run: cargo test -p tom-dht --lib

      - name: Clippy
        run: cargo clippy -p tom-dht -- -D warnings

  rust-security:
    name: Rust supply chain (cargo-deny)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # advisories couvre la base RustSec (équivalent cargo-audit) ;
      # 7 advisories ignorées dans deny.toml (chacune justifiée en ligne),
      # toute nouvelle advisory fait échouer ce job.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources

  rust-ffi:
    name: Rust FFI (build + clippy)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "ffi-v2"
          workspaces: |
            .
            crates/tom-protocol-ffi

      - name: Build tom-relay-ffi (workspace member)
        run: cargo build -p tom-relay-ffi

      - name: Clippy tom-relay-ffi
        run: cargo clippy -p tom-relay-ffi -- -D warnings

      # tom-protocol-ffi est exclu du workspace ([patch.crates-io] tvOS local)
      # → buildé via son propre manifeste, cf. Cargo.toml racine.
      # --locked : son Cargo.lock est versionné exprès (dérive dalek pre-release sinon)
      - name: Build tom-protocol-ffi (excluded crate)
        working-directory: crates/tom-protocol-ffi
        run: cargo build --locked

      - name: Clippy tom-protocol-ffi
        working-directory: crates/tom-protocol-ffi
        run: cargo clippy --locked -- -D warnings

      # Le header C est généré par cbindgen — toute dérive vs le code Rust
      # doit être commitée via scripts/generate-ffi-header.sh
      - name: Install cbindgen
        uses: taiki-e/install-action@v2
        with:
          tool: cbindgen

      - name: Check FFI header drift
        run: ./scripts/generate-ffi-header.sh --check

  # La cible SDK n°1 est Apple (décision D2) : ce job garantit que la couche
  # FFI builde sur macOS — jamais vérifié en CI auparavant (ubuntu only).
  rust-macos:
    name: Rust macOS (FFI build)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "ffi-v2"
          workspaces: |
            .
            crates/tom-protocol-ffi

      - name: Build tom-relay-ffi
        run: cargo build -p tom-relay-ffi

      - name: Build tom-protocol-ffi (excluded crate)
        working-directory: crates/tom-protocol-ffi
        run: cargo build --locked

  rust-stress:
    name: Rust stress (build + clippy + localhost test)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p tom-stress

      - name: Clippy
        run: cargo clippy -p tom-stress -- -D warnings

      - name: Localhost stress test
        run: crates/tom-stress/scripts/test-localhost.sh
        timeout-minutes: 5

  rust-poc:
    name: Rust PoC (build + clippy + localhost test)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/iroh-poc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: experiments/iroh-poc

      - name: Debug target directory
        run: |
          echo "pwd=$(pwd)"
          cargo metadata --format-version 1 --no-deps | python3 -c "import sys, json; print('target_directory=' + json.load(sys.stdin)['target_directory'])"

      - name: Build
        run: cargo build --bin nat-test

      - name: Clippy
        run: cargo clippy --bin nat-test -- -D warnings

      - name: Localhost NAT test
        run: ./scripts/test-localhost.sh
        timeout-minutes: 3

  # Contrôle final : seul check requis par le ruleset de main. Son nom sert de clé.
  # Il échoue si `changes` n'est pas vert, si un job a échoué ou été annulé, ou si
  # un job a été sauté alors que du code a changé. Garde anti-oubli : la liste
  # `needs` doit couvrir tous les autres jobs de ce fichier (un job absent de
  # `needs` ne bloquerait rien).
  harnais-ok:
    name: harnais-ok
    needs: [changes, typescript, observability-smoke, rust-protocol, rust-transport, rust-integration, rust-fork, rust-dht, rust-security, rust-ffi, rust-macos, rust-stress, rust-poc]
    # always() : le job tourne même si un job a échoué ou a été sauté, pour trancher explicitement.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agréger les résultats des jobs requis
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "  \(.key) = \(.value.result)"'
          # 1. needs couvre tous les jobs du workflow (hors harnais-ok).
          wf_jobs="$(awk '/^jobs:/ { f = 1; next } f && /^[^ \t#]/ { f = 0 } f && /^  [A-Za-z0-9_-]+:[ \t]*$/ { sub(/^  /, ""); sub(/:.*/, ""); print }' .github/workflows/ci.yml | grep -vx 'harnais-ok' | sort)"
          need_jobs="$(echo "$NEEDS_JSON" | jq -r 'keys[]' | sort)"
          if [ "$wf_jobs" != "$need_jobs" ]; then
            echo "::error::needs de harnais-ok incomplet. Jobs : $(echo $wf_jobs) / needs : $(echo $need_jobs)"
            exit 1
          fi
          # 2. changes doit être vert.
          changes="$(echo "$NEEDS_JSON" | jq -r '.changes.result')"
          code="$(echo "$NEEDS_JSON" | jq -r '.changes.outputs.code // ""')"
          if [ "$changes" != "success" ]; then
            echo "::error::Le job changes n'est pas vert ($changes)"
            exit 1
          fi
          # 3. chaque job : vert, ou sauté parce que seul vault/ change.
          bad="$(echo "$NEEDS_JSON" | jq -r --arg code "$code" 'to_entries[]
            | select(.key != "changes")
            | select(.value.result != "success" and (.value.result != "skipped" or $code != "false"))
            | "\(.key)=\(.value.result)"')"
          if [ -n "$bad" ]; then
            echo "::error::Jobs non verts (code=$code) : $(echo $bad)"
            exit 1
          fi
          echo "harnais-ok : OK (code=$code)"
