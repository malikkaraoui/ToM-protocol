name: TomNode
options:
  bundleIdPrefix: malik.karaoui
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  useBaseGroupList: true
  fileSystemSynchronizedGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    ENABLE_BITCODE: NO
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES

# SDK Apple ToM — package local (S2.4). L'artefact binaire est injecté dans
# le package par scripts/sync-xcframework-to-package.sh (cf. sdk/swift/TomProtocolKit).
packages:
  TomProtocolKit:
    path: ../../sdk/swift/TomProtocolKit

targets:
  TomNode:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: TomNode
        createIntermediateGroups: true
    info:
      path: TomNode/Info.plist
      properties:
        CFBundleName: TomNode
        CFBundleDisplayName: TomNode
        CFBundleIdentifier: malik.karaoui.TomNode-iOS
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        NSLocalNetworkUsageDescription: "ToM Protocol uses the local network for peer discovery."
        NSBonjourServices:
          - _iroh._udp
        UIBackgroundModes:
          - audio
          - fetch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: malik.karaoui.TomNode-iOS
        PRODUCT_NAME: TomNode
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
    dependencies:
      - package: TomProtocolKit
    preBuildScripts:
      - name: Check TomProtocolKit artifact
        script: |
          set -e
          XCFW="${PROJECT_DIR}/../../sdk/swift/TomProtocolKit/Artifacts/TomProtocolFFI.xcframework"
          if [ ! -d "$XCFW" ]; then
            echo "warning: XCFramework absent du package — lancer scripts/build-tom-protocol-ffi-xcframework.sh puis scripts/sync-xcframework-to-package.sh"
          fi
        basedOnDependencyAnalysis: false
        showEnvVars: true
