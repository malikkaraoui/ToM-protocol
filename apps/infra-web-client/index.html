<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToM · Réseau</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #060912;
        --bg-2: #0a0f1d;
        --ink: #eaf1fb;
        --muted: #6f8099;
        --faint: #3a465f;
        --line: #18223a;
        --card: #0c1322;
        --card-2: #0f1830;
        --ok: #2fe5a8;
        --ok-dim: #0d3b30;
        --warn: #ffb74d;
        --warn-dim: #3d2e0c;
        --ko: #ff6178;
        --ko-dim: #3a1420;
        --beam: #54d6ff;
        --beam-dim: #0e3550;
        --glow-ok: rgba(47, 229, 168, 0.55);
        --glow-beam: rgba(84, 214, 255, 0.5);
        font-synthesis: none;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 700px at 78% -8%, rgba(84, 214, 255, 0.08), transparent 60%),
          radial-gradient(900px 600px at 10% 110%, rgba(47, 229, 168, 0.06), transparent 55%),
          linear-gradient(180deg, var(--bg), var(--bg-2));
        background-attachment: fixed;
        -webkit-font-smoothing: antialiased;
      }
      .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }

      .app { max-width: 1180px; margin: 0 auto; padding: 34px 28px 60px; }

      /* ── Hero ── */
      .hero {
        display: flex; align-items: flex-end; justify-content: space-between;
        gap: 24px; flex-wrap: wrap; margin-bottom: 26px;
        animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      .brand {
        font-weight: 800; font-size: 13px; letter-spacing: 0.32em; text-transform: uppercase;
        color: var(--muted); display: flex; align-items: center; gap: 9px; margin-bottom: 14px;
      }
      .brand .pip {
        width: 8px; height: 8px; border-radius: 50%; background: var(--beam);
        box-shadow: 0 0 14px var(--glow-beam); animation: blink 2.4s ease-in-out infinite;
      }
      .verdict { font-size: clamp(30px, 5vw, 52px); line-height: 1.02; font-weight: 700; letter-spacing: -0.02em; }
      .verdict em { font-style: normal; color: var(--ok); }
      .verdict.is-warn em { color: var(--warn); }
      .verdict.is-down em { color: var(--ko); }
      .subline { color: var(--muted); font-size: 15px; margin-top: 10px; max-width: 46ch; }

      .live {
        display: flex; align-items: center; gap: 10px; padding: 11px 16px;
        border: 1px solid var(--line); border-radius: 999px; background: rgba(12, 19, 34, 0.6);
        font-size: 12.5px; color: var(--muted); white-space: nowrap;
      }
      .live .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 12px var(--glow-ok); animation: blink 1.8s ease-in-out infinite; }
      .live b { color: var(--ink); font-weight: 600; }
      .live button {
        border: none; background: transparent; color: var(--muted); cursor: pointer;
        font: inherit; padding: 0 0 0 6px; border-left: 1px solid var(--line); margin-left: 4px;
      }
      .live button:hover { color: var(--beam); }

      /* ── Topologie ── */
      .stage {
        position: relative; border: 1px solid var(--line); border-radius: 22px;
        background:
          radial-gradient(700px 360px at 50% 18%, rgba(84, 214, 255, 0.06), transparent 70%),
          var(--card);
        overflow: hidden; margin-bottom: 14px;
        animation: rise 0.8s 0.06s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      .stage::before {
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background-image: radial-gradient(circle at center, rgba(255,255,255,0.025) 1px, transparent 1.4px);
        background-size: 26px 26px; mask-image: radial-gradient(70% 70% at 50% 40%, #000, transparent);
      }
      #topo { display: block; width: 100%; height: 380px; }
      .stage-empty {
        position: absolute; inset: 0; display: none; flex-direction: column;
        align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 24px;
      }
      .stage-empty .big { font-size: 19px; font-weight: 600; }
      .stage-empty .small { color: var(--muted); font-size: 13.5px; max-width: 42ch; }
      .stage.is-empty .stage-empty { display: flex; }

      .edge { stroke: var(--beam-dim); stroke-width: 1.4; }
      .edge.lit { stroke: var(--beam); filter: drop-shadow(0 0 4px var(--glow-beam)); }
      .pulse { fill: var(--beam); }
      .node-hit { cursor: default; }
      .node-ring { fill: none; stroke-width: 2; }
      .node-core { filter: drop-shadow(0 0 10px currentColor); }
      .node-name { font-family: "Bricolage Grotesque"; font-weight: 600; font-size: 13px; fill: var(--ink); }
      .node-meta { font-family: "JetBrains Mono"; font-size: 10px; fill: var(--muted); }

      /* ── Strip stats ── */
      .strip {
        display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 30px;
        animation: rise 0.8s 0.12s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      .metric {
        border: 1px solid var(--line); border-radius: 16px; background: var(--card);
        padding: 16px 18px; position: relative; overflow: hidden;
      }
      .metric .lab { color: var(--muted); font-size: 12px; letter-spacing: 0.02em; }
      .metric .val { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; margin-top: 6px; line-height: 1; }
      .metric .val small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 4px; }
      .metric .spark { position: absolute; right: 14px; top: 16px; font-size: 17px; opacity: 0.85; }

      /* ── Nodes ── */
      .nodes-head { display: flex; align-items: baseline; justify-content: space-between; margin: 0 2px 14px; }
      .nodes-head h2 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
      .nodes-head .hint { color: var(--muted); font-size: 12.5px; }
      .nodes { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }

      .node {
        border: 1px solid var(--line); border-radius: 18px; background: linear-gradient(180deg, var(--card-2), var(--card));
        padding: 0; overflow: hidden; position: relative;
        animation: rise 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      .node::after {
        content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
        background: var(--state, var(--faint)); box-shadow: 0 0 16px var(--state-glow, transparent);
      }
      .node-top { display: flex; align-items: center; gap: 12px; padding: 16px 18px 12px; }
      .avatar {
        width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
        font-size: 21px; background: var(--card); border: 1px solid var(--line); flex-shrink: 0;
      }
      .node-id { min-width: 0; flex: 1; }
      .node-id .nm { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
      .node-id .sub { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
      .pill {
        font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap;
        border: 1px solid var(--state, var(--faint)); color: var(--state, var(--muted));
        background: var(--state-bg, transparent);
      }
      .node-body { padding: 4px 18px 18px; }
      .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
      .stat { background: rgba(255,255,255,0.018); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; }
      .stat .k { color: var(--muted); font-size: 11px; }
      .stat .v { font-size: 22px; font-weight: 700; margin-top: 3px; line-height: 1; letter-spacing: -0.01em; }
      .stat .v small { font-size: 12px; color: var(--muted); font-weight: 500; }
      .meta-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); padding-top: 4px; border-top: 1px solid var(--line); margin-top: 4px; }
      .meta-row .mono { color: var(--ink); }
      .groups { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
      .gchip { font-size: 11px; padding: 3px 9px; border-radius: 8px; background: var(--beam-dim); color: var(--beam); border: 1px solid transparent; }
      .node.seen { opacity: 0.96; }
      .node.seen .node-body { color: var(--muted); }
      .seen-note { font-size: 12.5px; color: var(--muted); padding: 2px 0 4px; }

      .foot { margin-top: 34px; color: var(--faint); font-size: 12px; text-align: center; }
      .foot .mono { color: var(--muted); }

      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @media (max-width: 720px) {
        .strip { grid-template-columns: repeat(2, 1fr); }
        #topo { height: 320px; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="hero">
        <div>
          <div class="brand"><span class="pip"></span> ToM · réseau pair-à-pair</div>
          <div class="verdict" id="verdict">Connexion…</div>
          <div class="subline" id="subline">Détection des nœuds en cours.</div>
        </div>
        <div class="live">
          <span class="dot"></span> live · <b id="liveCount">—</b>
          <button id="pauseBtn" title="Mettre en pause">pause</button>
        </div>
      </header>

      <div class="stage" id="stage">
        <svg id="topo" viewBox="0 0 1000 380" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="stage-empty">
          <div class="big">Aucun nœud joignable</div>
          <div class="small" id="emptyHint">
            Lance l'app TomNode sur ce Mac, ou vérifie que le NAS est en ligne.
          </div>
        </div>
      </div>

      <section class="strip" id="strip"></section>

      <div class="nodes-head">
        <h2>Nœuds du réseau</h2>
        <span class="hint" id="nodesHint">découverte automatique</span>
      </div>
      <section class="nodes" id="nodes"></section>

      <div class="foot" id="foot"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
